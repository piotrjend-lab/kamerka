name: Build KameraUSB.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exe
        run: python -m PyInstaller --noconsole --onefile --name KameraUSB kamera_usb.py
      - uses: actions/upload-artifact@v4
        with:
          name: KameraUSB
          path: dist/KameraUSB.exe
